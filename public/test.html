<!DOCTYPE html>
<html lang="ko">
<body>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{max-width:480px;margin:2rem auto;padding:0 1rem;font-family:sans-serif}
.title{font-size:18px;font-weight:500;margin-bottom:1.5rem}
.fields{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}
input[type=text],input[type=file]{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.btn{width:100%;padding:10px;background:#111;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result{margin-top:1.25rem;padding:1rem 1.25rem;background:#f5f5f5;border-radius:12px;display:none}
.result-label{font-size:12px;color:#888;margin-bottom:6px}
.result-link{font-size:14px;font-weight:500;color:#1a6ef5;word-break:break-all}
.result-id{font-size:12px;color:#aaa;margin-top:6px;font-family:monospace}
.err{margin-top:1rem;padding:.75rem 1rem;background:#fff0f0;border-radius:8px;font-size:13px;color:#cc0000;display:none}
</style>

<div class="wrap">
  <p class="title">GovGen 생성</p>
  <form id="form">
    <div class="fields">
      <input type="text" name="name" placeholder="이름" required>
      <input type="text" name="birth" placeholder="생년월일">
      <input type="text" name="location" placeholder="위치">
      <input type="text" name="detailLocation" placeholder="세부위치">
      <input type="text" name="cityHall" placeholder="관할시청">
      <input type="file" name="photo" accept="image/*">
    </div>
    <button class="btn" type="submit" id="btn">생성</button>
  </form>
  <div class="err" id="err"></div>
  <div class="result" id="result">
    <p class="result-label">생성 완료 — 아래 링크를 눌러 확인하세요</p>
    <a class="result-link" id="result-link" href="#" target="_blank" id="result-url"></a>
    <p class="result-id" id="result-id"></p>
  </div>
</div>

<script>
const form = document.getElementById("form")
const btn = document.getElementById("btn")
const resultBox = document.getElementById("result")
const resultLink = document.getElementById("result-link")
const resultId = document.getElementById("result-id")
const errBox = document.getElementById("err")

form.addEventListener("submit", async (e) => {
  e.preventDefault()
  btn.disabled = true
  btn.textContent = "생성 중..."
  resultBox.style.display = "none"
  errBox.style.display = "none"

  try {
    const res = await fetch("/generate", { method: "POST", body: new FormData(form) })
    const data = await res.json()

    if (!data.success) throw new Error(data.error || "서버 오류")

    resultLink.href = data.url
    resultLink.textContent = data.url
    resultId.textContent = "ID: " + data.id
    resultBox.style.display = "block"
  } catch (err) {
    errBox.textContent = "오류: " + err.message
    errBox.style.display = "block"
  } finally {
    btn.disabled = false
    btn.textContent = "생성"
  }
})
</script>
</body>
</html>
