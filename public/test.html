<!DOCTYPE html>
<html lang="ko">
<body>

<form id="form">

  <input
    type="text"
    name="name"
    placeholder="이름"
  >

  <input
    type="text"
    name="birth"
    placeholder="생년월일"
  >

  <input
    type="text"
    name="location"
    placeholder="위치"
  >

  <input
    type="text"
    name="detailLocation"
    placeholder="세부위치"
  >

  <input
    type="text"
    name="cityHall"
    placeholder="관할시청"
  >

  <input
    type="file"
    name="photo"
  >

  <button>
    생성
  </button>

</form>

<script>

const form =
  document.getElementById("form")

form.addEventListener(
  "submit",
  async (e) => {

    e.preventDefault()

    const formData =
      new FormData(form)

    const res =
      await fetch(
        "/generate",
        {
          method: "POST",
          body: formData
        }
      )

    const data =
      await res.json()

    console.log(data)

    alert(data.id)
})

</script>

</body>
</html>
